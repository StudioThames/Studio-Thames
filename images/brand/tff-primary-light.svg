<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Thames Field and Films cinematic field hybrid logo</title>
  <desc id="desc">A clear TFF monogram framed above rolling mountain and wind lines, paired with an elegant editorial wordmark.</desc>

  <rect width="1200" height="600" fill="#f3f1eb"/>

  <!-- Primary emblem: cinematic frame from Concept One -->
  <g transform="translate(64 106)">
    <rect x="0" y="0" width="470" height="300" rx="20" fill="#101312"/>
    <rect x="10" y="10" width="450" height="280" rx="13" fill="none" stroke="#b78a45" stroke-width="2" opacity="0.9"/>

    <!-- Rolling mountain and wind movement from Concept Two -->
    <path d="M34 226 C92 185 148 184 199 214 C250 244 307 250 351 213 C383 187 417 190 440 209"
          fill="none" stroke="#b78a45" stroke-width="7" stroke-linecap="round"/>
    <path d="M34 253 C96 222 151 218 207 241 C264 265 329 269 383 239 C405 227 424 224 440 226"
          fill="none" stroke="#71808a" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Separate letterforms prevent the two Fs from merging visually -->
    <g fill="none" stroke="#f3f1eb" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M45 67 H171 M108 67 V208"/>
      <path d="M206 208 V67 H296 M206 131 H282"/>
      <path d="M337 208 V67 H427 M337 131 H413"/>
    </g>
  </g>

  <!-- Editorial wordmark treatment from Concept One -->
  <g transform="translate(594 155)">
    <text x="0" y="74" fill="#101312" font-family="Georgia, 'Times New Roman', serif" font-size="71" letter-spacing="7">THAMES</text>
    <line x1="2" y1="105" x2="480" y2="105" stroke="#71808a" stroke-width="1.5"/>
    <text x="2" y="155" fill="#b78a45" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="8">FIELD &amp; FILMS</text>
    <text x="3" y="210" fill="#454b4d" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">STORIES SHAPED BY PLACE</text>
  </g>

  <g transform="translate(66 482)">
    <line x1="0" y1="0" x2="1068" y2="0" stroke="#d5b88d" stroke-width="1"/>
    <text x="0" y="42" fill="#5c6263" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2.8">OUTDOOR PHOTOGRAPHY  &#8226;  FILM  &#8226;  AERIAL</text>
  </g>
</svg>
