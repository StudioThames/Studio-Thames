  <path fill="#b77943" d="M88 439c90-28 177-28 260-2 44 14 97 27 164 27-61 5-119-1-173-14-79-19-163-17-251 6z"/>
  <path fill="#b77943" d="M112 467c80-17 145-12 194 13 28 14 81 25 158 32-92 1-160-7-204-24-38-15-87-18-148-9 39-15 64-28 64-39 0-8-21-14-64-17 73-6 120 2 140 21 17 17 0 34-52 51 56-9 104-7 144 7-66-6-119-16-158-30-31-11-72-13-124-5z"/>
</svg>
