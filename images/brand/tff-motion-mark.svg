<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Thames Field and Films circular TFF mark</title>
  <desc id="desc">A black circular field with a bronze ring, one ivory T overlapping two ivory Fs, and a bronze mountain ridge and flowing river.</desc>
  <circle cx="300" cy="300" r="292" fill="#0b0d0c"/>
  <circle cx="300" cy="300" r="286" fill="none" stroke="#b77943" stroke-width="10"/>
  <!-- Two restrained cinematic serif Fs, intentionally behind the central T. -->
  <g fill="#f3efe4">
    <path d="M119 190h154v47h-22c-5-22-19-29-47-29h-30v62h28c22 0 31-7 36-25h18v72h-18c-5-19-14-27-36-27h-28v58c0 24 8 32 34 35v17H112v-17c25-3 33-11 33-35V242c0-22-7-31-26-35z"/>
    <path d="M327 190h154v47h-22c-5-22-19-29-47-29h-30v62h28c22 0 31-7 36-25h18v72h-18c-5-19-14-27-36-27h-28v58c0 24 8 32 34 35v17h-96v-17c25-3 33-11 33-35V242c0-22-7-31-26-35z"/>
  </g>
  <!-- One central T, drawn last so it overlaps and visually covers both Fs. -->
  <path fill="#f3efe4" d="M176 140h248l9 66h-21c-9-31-27-42-68-42h-20v182c0 29 9 38 39 42v18H237v-18c30-4 39-13 39-42V164h-20c-41 0-59 11-68 42h-21z"/>
  <!-- Mountain ridge and river are part of the mark, not a photo overlay. -->
